name: Compilar PTV Plus Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'PTVPlus-Windows*.zip'
      - 'src/**'
      - '.github/workflows/build.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto adjunto
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/PTVPlus/PTVPlus.csproj')) {
            $zip = Get-ChildItem -File -Filter 'PTVPlus-Windows*.zip' | Select-Object -First 1
            if (-not $zip) { throw 'Sube el ZIP del proyecto o los archivos extraídos.' }
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath . -Force
          }
          if (-not (Test-Path 'src/PTVPlus/PTVPlus.csproj')) { throw 'No aparece src/PTVPlus/PTVPlus.csproj en el ZIP.' }

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Motor multimedia oficial libmpv Windows x64
        shell: pwsh
        run: |
          $dest = 'src/PTVPlus/libmpv-2.dll'
          if (-not (Test-Path $dest)) {
            $url = 'https://github.com/mpv-player/mpv/releases/download/v0.42.0/libmpv-v0.42.0-x86_64-w64-mingw32-lgpl.zip'
            Invoke-WebRequest -Uri $url -OutFile libmpv.zip -MaximumRedirection 10
            $hash = (Get-FileHash libmpv.zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = '8e5f77430efc53ef175804ba6618527e3af0448a0dcabf04d3cc72659d1a6fce'
            if ($hash -ne $expected) { throw "Archivo libmpv no coincide con SHA256 oficial: $hash" }
            Expand-Archive -Path libmpv.zip -DestinationPath .mpv-native -Force
            $dll = Get-ChildItem -Path .mpv-native -Recurse -File -Filter libmpv-2.dll | Select-Object -First 1
            if (-not $dll) { throw 'El paquete libmpv no contiene libmpv-2.dll.' }
            Copy-Item $dll.FullName $dest
            $vulkan = Get-ChildItem -Path .mpv-native -Recurse -File -Filter vulkan-1.dll | Select-Object -First 1
            if ($vulkan) { Copy-Item $vulkan.FullName 'src/PTVPlus/vulkan-1.dll' }
          }

      - name: Verificar estructura básica del proyecto
        shell: pwsh
        run: |
          $files = @('src/PTVPlus/Core/Cloud.cs', 'src/PTVPlus/Player/Playback.cs', 'src/PTVPlus/UI/Pages/LivePage.cs', 'src/PTVPlus/UI/Pages/PlayerPage.cs', 'src/PTVPlus/UI/Pages/MultiPage.cs')
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Falta archivo: $file" } }

      - name: Compilar .exe (un solo archivo, sin instalar .NET)
        shell: pwsh
        run: |
          dotnet publish 'src/PTVPlus/PTVPlus.csproj' --configuration Release --runtime win-x64 --self-contained true --output ./resultado
          if ($LASTEXITCODE -ne 0) { throw 'Falló dotnet publish: revisa el registro.' }
          if (-not (Test-Path './resultado/PTVPlus.exe')) { throw 'No se generó PTVPlus.exe.' }

      - name: Entregar EXE
        uses: actions/upload-artifact@v4
        with:
          name: PTVPlus-Windows-1.0.3-EXE
          path: resultado/PTVPlus.exe
          if-no-files-found: error
